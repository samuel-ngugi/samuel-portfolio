<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Projects | Samuel Ngugi</title>

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <header class="header">

        <a href="projects.html" class="logo">
            Samuel<span>Ngugi</span>
        </a>


        <i class="bx bx-menu" id="menu-icon"></i>


        <nav class="navbar">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="services.html">
                Services
            </a>


            <a href="contacts.html">
                Contact
            </a>

        </nav>

    </header>


    <section class="projects" id="projects">


        <h2 class="heading">
            My <span>Project</span>
        </h2>


        <div class="projects-container">


            <div class="project-box">


                <div class="project-main-image">


                    <button
                        class="gallery-btn prev-btn"
                        id="prevBtn"
                        type="button"
                        aria-label="Previous image"
                    >

                        <i class="bx bx-chevron-left"></i>

                    </button>


                    <img
                        id="mainProjectImage"
                        src="prjct%20img/img%201.png"
                        alt="Portfolio Project Image"
                    >


                    <button
                        class="gallery-btn next-btn"
                        id="nextBtn"
                        type="button"
                        aria-label="Next image"
                    >

                        <i class="bx bx-chevron-right"></i>

                    </button>


                </div>


                <div class="project-thumbnails">


                    <img
                        src="prjct%20img/img%201.png"
                        alt="Portfolio Image 1"
                        class="thumbnail active-thumb"
                        data-index="0"
                    >


                    <img
                        src="prjct%20img/img%202.png"
                        alt="Portfolio Image 2"
                        class="thumbnail"
                        data-index="1"
                    >


                    <img
                        src="prjct%20img/img%203.png"
                        alt="Portfolio Image 3"
                        class="thumbnail"
                        data-index="2"
                    >


                </div>


                <div class="project-content">


                    <h3>
                        My Projects
                    </h3>


                    <p>

                        In this section,here are my projects

                    </p>

                </div>


            </div>


        </div>


    </section>


    <footer class="footer">

        <p>
            © 2026 Samuel Ngugi. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>


</body>

</html>
