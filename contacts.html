<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Me | Samuel Ngugi</title>

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <header class="header">

        <a href="contacts.html" class="logo">
            Samuel<span>Ngugi</span>
        </a>

        <i class="bx bx-menu" id="menu-icon"></i>

        <nav class="navbar">

            <a href="index.html">Home</a>

            <a href="about.html">About</a>

            <a href="services.html">Services</a>

            <a href="projects.html">Projects</a>

        </nav>

    </header>


    <section class="contact" id="contact">


        <div class="contact-content">

            <h2>
                Contact <span>Me</span>
            </h2>

            <p>
                Have a project in mind or want to work with me?
                Feel free to get in touch. I would be happy to
                hear from you.
            </p>


            <div class="contact-info">


                <div class="contact-item">

                    <i class="bx bx-envelope"></i>

                    <div>

                        <h4>Email</h4>

                        <p>
                            sammiehrashid@gmail.com
                        </p>

                    </div>

                </div>


                <div class="contact-item">

                    <i class="bx bx-phone"></i>

                    <div>

                        <h4>Phone</h4>

                        <p>
                            +254 140601800
                        </p>

                    </div>

                </div>


                <div class="contact-item">

                    <i class="bx bx-map"></i>

                    <div>

                        <h4>Location</h4>

                        <p>
                            Kenya
                        </p>

                    </div>

                </div>


            </div>

        </div>


        <form
            class="contact-form"
            action="https://formspree.io/f/xgavzged"
            method="POST">


            <input
                type="text"
                name="name"
                placeholder="Your Name"
                required
            >


            <input
                type="email"
                name="email"
                placeholder="Your Email"
                required
            >


            <input
                type="text"
                name="subject"
                placeholder="Subject"
                required
            >


            <textarea
                name="message"
                placeholder="Your Message"
                required
            ></textarea>


            <button type="submit">

                Send Message

                <i class="bx bx-send"></i>

            </button>


        </form>


    </section>


    <footer class="footer">

        <p>
            © 2026 Samuel Ngugi. All Rights Reserved.
        </p>

        <a href="#contact" class="footer-icon">

            <i class="bx bx-up-arrow-alt"></i>

        </a>

    </footer>



    <script src="script.js"></script>

</body>

</html>
